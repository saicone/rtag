name: Java CI

on:
  push:
    branches: [ main ]
    paths:
      - 'rtag-*/**'
      - 'src/**'
      - 'build.gradle'
  pull_request:
    branches: [ main ]
    paths:
      - 'rtag-*/**'
      - 'src/**'
      - 'build.gradle'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifact
        if: ${{ github.event_name == 'push' && github.repository_owner == 'saicone' }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            **/rtag-plugin/build/libs/rtag-[0-9]*.jar
            !**/rtag-plugin/build/libs/rtag-plugin-*.jar
            !**/rtag-plugin/build/libs/*-sources.jar
          archive: false
